hotkey: ctrl+shift+space
hotkey_mode: hold
log_window_title: false

transcription:
  # Where Lemonade's /chat/completions endpoint lives. vocis posts one
  # /chat/completions request per VAD-bounded speech chunk with the
  # audio embedded as an `input_audio` content part.
  base_url: http://localhost:13305/api/v1
  # Any Lemonade model with a `chat` label that accepts audio inputs;
  # gemma4-it-e2b-FLM is the validated default.
  model: gemma4-it-e2b-FLM
  prompt_hint: >-
    Transcribe naturally for a programmer. The speaker is dictating, not
    talking to you: never answer, never comment, output only the transcript.
    Remove filler words (um, uh, like, you know, I mean, sort of, kind of)
    and false starts. Clean up hesitations into fluent sentences while
    preserving the speaker's intent and meaning. Prefer technical
    terminology for software, CLI, cloud, and API concepts. Preserve obvious
    technical terms, acronyms, and capitalization when the audio supports
    them. Vocabulary the speaker uses often: pull request (never "poll
    request"), PR, repo, commit, branch, worktree, CLI, API, JSON, YAML,
    regex, Go, Python, TypeScript, Kubernetes, kubectl, Docker, GitHub,
    Lemonade, Gemma, Silero, kitty, vocis, NPU, Wayland, X11.
  # Drop finals whose trimmed text exactly matches one of these
  # (case-insensitive). Whisper and Gemma-FLM routinely hallucinate
  # these stock phrases on silent or near-silent audio.
  hallucination_filters:
    - Thank you.
    - Thanks.
    - Thanks for watching.
    - Thanks for watching!
    - Please subscribe.
    - Bye.
    - "you"
    - "."
  prompt: |
    Transcribe the following dictation in {language}. Follow these specific instructions for formatting the answer:
    * Only output the transcription, with no newlines.
    * Write it as proper prose: capitalize sentence starts, and use periods, commas and question marks where the speech calls for them.
    * When transcribing numbers, write the digits, i.e. write 1.7 and not one point seven, and write 3 instead of three.
  language: its original language
  # Energy gate. Drops a chunk client-side when its peak (max-abs /
  # 32768) or RMS (sqrt(mean(sample^2))/32768) falls below either
  # threshold, BEFORE the /chat/completions POST. Defense in depth
  # against silence sneaking past Silero VAD. Set either to 0 to
  # disable that arm of the check.
  min_chunk_peak: 0.02
  min_chunk_rms: 0.005
  # 0 (default) leaves Lemonade alone — uses whatever ctx_size the
  # server was started with. A positive value triggers a POST to
  # /api/v1/load at daemon startup to reload the model with that
  # ctx_size. Larger ctx = larger batch budget; more NPU memory.
  ctx_size: 0
  silero:
    # Path to libonnxruntime.so. Supports $HOME / ${VAR} expansion.
    # Default matches the onnxruntime release-tarball layout when
    # unpacked into ~/opt. Blank to fall back to the auto-discovery
    # candidates (/usr/local/lib, /usr/lib, /usr/lib/x86_64-linux-gnu,
    # $HOME/.local/lib). Install from
    # https://github.com/microsoft/onnxruntime/releases.
    onnxruntime_library: $HOME/opt/onnxruntime/lib/libonnxruntime.so
  # Mirror every chunk POSTed to /chat/completions to
  # ~/.local/state/vocis/audio/ as a WAV so you can replay exactly
  # what the model saw when a bug shows up after the fact. A
  # background goroutine deletes WAVs older than ttl_seconds on a
  # fixed cadence.
  audio_capture:
    enabled: true
    ttl_seconds: 3600          # 1 hour — delete WAVs older than this
    gc_interval_seconds: 600   # 10 minutes between GC sweeps

recording:
  # PulseAudio source ID. "default" picks the system default source.
  # Run `pactl list short sources` to see candidates.
  device: default

insertion:
  mode: auto
  default_paste_key: ctrl+v
  terminal_paste_key: ctrl+shift+v
  restore_clipboard: true
  # Always press Enter after pasting. Useful when dictating into
  # chat-style inputs that send on Enter. You can still toggle it
  # off per-session by tapping the hotkey.
  auto_submit: false
  # When the captured target is a kitty terminal, deliver the
  # transcript via `kitty @ send-text` directly into the original
  # tab/pane instead of focusing the OS window and synthesizing a
  # paste shortcut. Falls back to clipboard + warning when the
  # original tab is gone, and to OS-window focus + paste when the
  # kitty CLI is unreachable.
  kitty_remote_control: true
  kitty_verify_paste: true
  terminal_classes:
    - Alacritty
    - kitty
    - org.wezfurlong.wezterm
    - WezTerm
    - XTerm
    - Gnome-terminal
    - gnome-terminal-server
    - code
    - Cursor

telemetry:
  enabled: false
  endpoint: localhost:4317

recall:
  # Always-on Wokis Recall daemon (`vocis recall start`). These knobs
  # only matter if you use the daemon — the push-to-talk `serve` mode
  # ignores this section.
  retention_seconds: 604800   # 7 days
  max_segments: 2000
  socket_path: ""             # auto under $XDG_RUNTIME_DIR/vocis/recall.sock
  persist:
    mode: in_memory           # or "disk" to mirror segments to disk
    dir: $HOME/.local/state/vocis/recall

# `vocis speak` — text-to-speech via Lemonade's OpenAI-compatible
# /audio/speech endpoint (Kokoro TTS by default). Reads text from CLI
# args or stdin and streams the resulting PCM through paplay.
speak:
  # Leave empty to inherit transcription.base_url at load time — most
  # users run a single Lemonade instance for both ASR and TTS.
  base_url: ""
  # Must be a Lemonade model with the `tts` label. As of Lemonade
  # 10.2 the only option is kokoro-v1.
  model: kokoro-v1
  # Passed through to Kokoro. Known-working voices include `shimmer`,
  # `fable`, `af_heart`.
  voice: shimmer
