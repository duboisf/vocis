hotkey: ctrl+shift+space
hotkey_mode: hold
log_window_title: false

transcription:
  # backend: only "lemonade-chat" is supported. It posts each VAD-bounded
  # speech chunk to Lemonade's /chat/completions endpoint with the audio
  # embedded as an `input_audio` content part. Pairs with Gemma audio
  # variants (gemma4-it-e2b-FLM, gemma3n-e4b-it-FLM). Audio is capped at
  # 30s per request; longer utterances chunk transparently with few-shot
  # history threading context across boundaries.
  backend: lemonade-chat
  base_url: http://localhost:13305/api/v1
  model: gemma4-it-e2b-FLM
  language: en
  prompt_hint: >-
    Transcribe naturally for a programmer. Remove filler words (um, uh, like,
    you know, I mean, sort of, kind of) and false starts. Clean up hesitations
    into fluent sentences while preserving the speaker's intent and meaning.
    Prefer technical terminology for software, CLI, cloud, and API concepts.
    Preserve obvious technical terms, acronyms, and capitalization when the
    audio supports them.
  request_timeout_seconds: 45
  # Drop finals whose trimmed text exactly matches one of these
  # (case-insensitive). Whisper and Gemma-FLM routinely hallucinate
  # stock phrases on silent or near-silent audio. Exact match only —
  # substring filters would eat legitimate speech like the start of
  # "Thank you for helping me with this."
  hallucination_filters:
    - Thank you.
    - Thanks.
    - Thanks for watching.
    - Thanks for watching!
    - Please subscribe.
    - Bye.
    - "you"
    - "."
  # chat_audio: knobs for the lemonade-chat backend. Ignored on the
  # other backends. The chat-audio path is fundamentally request/response
  # rather than streaming-WS — speech is segmented client-side via Silero
  # VAD, each segment is wrapped in a WAV and sent as one POST to
  # /chat/completions, and a few-shot history of prior (audio, transcript)
  # pairs threads context across the documented 30s per-call cap.
  chat_audio:
    # Upper bound on a single chunk's audio duration. Gemma 3n / 4 cap
    # at 30s per request, so hold a 2s margin under that. Long monologues
    # without a VAD-detected pause force-cut here and roll the remainder
    # into the next chunk.
    chunk_max_seconds: 28
    # How many prior (user-audio, assistant-transcript) pairs to include
    # as few-shot context on each request. 0 disables history. Each
    # extra turn adds ~1.3 MB of base64 audio worst-case, so keep modest.
    history_turns: 2
    # Instruction sent alongside every audio chunk. {language} expands
    # to chat_audio.language at request build time.
    prompt: |
      Transcribe the following speech segment in {language}. Follow these specific instructions for formatting the answer:
      * Only output the transcription, with no newlines.
      * When transcribing numbers, write the digits, i.e. write 1.7 and not one point seven, and write 3 instead of three.
    # Language hint substituted into prompt. Use "its original language"
    # to let the model auto-detect, or force "en", "fr", etc.
    language: its original language
    # SSE streaming for live overlay updates. Off uses one round-trip
    # per chunk and shows the full chunk transcript only on completion.
    stream: true
    # context_mode: how prior chunks are threaded into a new request.
    #   few_shot     - each prior chunk becomes a (user-audio,
    #                  assistant-transcript) turn pair. The model sees
    #                  its own transcripts verbatim, which keeps
    #                  proper-noun spelling stable across chunks. Cost:
    #                  re-uploads the prior audio bytes on every
    #                  request.
    #   inline_clips - prior chunks are appended as additional
    #                  input_audio parts inside the same user message,
    #                  alongside the current chunk. The model gets all
    #                  audio at once and produces one transcript
    #                  covering only the final clip (per the prompt
    #                  instruction). Matches the multi-clip shape
    #                  Google's Gemma docs show. Cost: model has to
    #                  re-decode prior audio instead of trusting a
    #                  prior transcript, so cross-chunk consistency is
    #                  weaker.
    context_mode: few_shot
    # min_chunk_peak / min_chunk_rms: drop a chunk client-side when
    # its peak (max-abs / 32768) or RMS (sqrt(mean(sample^2))/32768)
    # falls below these thresholds, BEFORE the /chat/completions POST.
    # Critical when Silero isn't installed: without VAD, a hotkey hold
    # over silence sends the entire silent buffer to Gemma, which then
    # hallucinates a long "I cannot transcribe..." response. Defaults
    # match the recall daemon's segment filters and reject fan/room
    # tone while keeping quiet speech. Set either to 0 to disable that
    # arm of the check.
    min_chunk_peak: 0.02
    min_chunk_rms: 0.005
    # batch_until_release: when true, Silero still trims dead air between
    # speech episodes, but each VAD-stopped flush gets stashed instead of
    # POSTed. Only the trailing flush at hotkey release fires the request
    # — as one multi-clip POST covering the whole utterance. Trade-off:
    # no live overlay partials during dictation (one paste at the end).
    # Wins: model sees the full utterance as one continuous thing so
    # punctuation/casing don't break across mid-phrase pauses, and the
    # few-shot history is moot for the single request.
    batch_until_release: false
    # continuation_rebatch: keep per-pause POSTs, but when the previous
    # chunk's transcript ended without terminal punctuation (./?/!/…),
    # send the NEXT chunk as a multi-clip POST that prepends the prior
    # audio. The model returns one unified transcript for both clips,
    # which replaces (not appends to) the prior history entry. A
    # replace-segment event tells the overlay + injector to retract the
    # broken prior segment and substitute the fix (backspace + retype in
    # the target window). Mutually exclusive with batch_until_release.
    continuation_rebatch: false
    # NOTE: when postprocess.enabled is true, vocis automatically folds
    # postprocess.prompt into the chat-audio system message and skips
    # the separate /chat/completions cleanup call. The same Gemma model
    # is doing both transcription and cleanup, so the second round-trip
    # would just add latency.

recording:
  backend: auto
  device: default
  sample_rate: 16000
  channels: 1
  max_duration_seconds: 120
  duck_volume: 0.1

streaming:
  # Silero VAD knobs used by the chat-audio backend to bound each
  # speech episode before posting to /chat/completions. Commit 2 moves
  # these under transcription.chat_audio.silero with clearer names.
  #
  # prefix_padding_ms: minimum speech duration before Silero opens an
  # episode (default 150).
  # silence_duration_ms: minimum non-speech duration before Silero
  # closes one (default 500).
  prefix_padding_ms: 150
  silence_duration_ms: 500
  # min_utterance_ms: minimum accumulated speech an episode needs
  # before it can be committed. Shorter clips are dropped so Gemma
  # doesn't hallucinate on sub-second audio. Default 1000.
  min_utterance_ms: 1000
  # onnxruntime_library: path to libonnxruntime.so. Supports $HOME
  # and other env vars (expanded at runtime via os.ExpandEnv).
  # Default matches the onnxruntime release-tarball layout when
  # unpacked into ~/opt. Blank the field to fall back to the
  # auto-discovery candidates (/usr/local/lib, /usr/lib,
  # /usr/lib/x86_64-linux-gnu, $HOME/.local/lib). Install from
  # https://github.com/microsoft/onnxruntime/releases.
  onnxruntime_library: $HOME/opt/onnxruntime/lib/libonnxruntime.so

insertion:
  mode: auto
  default_paste_key: ctrl+v
  terminal_paste_key: ctrl+shift+v
  restore_clipboard: true
  # auto_submit: always press Enter after pasting the transcript.
  # Useful when dictating into chat-style inputs that send on Enter.
  # You can still toggle it off per-session by tapping the hotkey
  # (which flips submit mode for that dictation).
  auto_submit: false
  # kitty_remote_control: when the captured target is a kitty terminal,
  # deliver the transcript via `kitty @ send-text` directly into the
  # original tab/pane instead of focusing the OS window and synthesizing
  # a paste shortcut. No focus theft, no clipboard pollution, lands in
  # the original tab even after you switch tabs mid-dictation. Falls
  # back to clipboard + warning when the original tab is gone, and to
  # OS-window focus + paste when the kitty CLI is unreachable.
  # Requires `allow_remote_control` (and ideally `listen_on`) in
  # kitty.conf, or vocis launched from inside kitty so KITTY_LISTEN_ON
  # is inherited.
  kitty_remote_control: true
  terminal_classes:
    - Alacritty
    - kitty
    - org.wezfurlong.wezterm
    - WezTerm
    - XTerm
    - Gnome-terminal
    - gnome-terminal-server
    - code
    - Cursor

overlay:
  width: 620
  height: 132
  margin_top: 44
  opacity: 0.94
  auto_hide_millis: 1800
  font: ""
  font_size: 13
  branding: Vocis
  ready:
    title: Ready
    subtitle: Voice typing is armed
  listening:
    title: Listening
    suffix: "— release to paste"
    submit_hint: "⏎ submit"
    connecting: "○ Connecting..."
    reconnecting: "○ Reconnecting... (attempt {attempt}/{max})"
    connected: "● Ready to type into {window}"
    # Shown while vocis is force-loading the configured transcription
    # model on the Lemonade backend (session-start preflight).
    loading_model: "○ Loading {model}..."
  finishing:
    title: Finishing
    cancel_hint: "— press {shortcut} to cancel"
    wrapping_up: Wrapping up
    # pp_wait / pp_stream are the postprocess phase labels appended to
    # the wrapping-up text while the LLM is thinking — pp_wait shows
    # until the first token arrives, then pp_stream until completion.
    pp_wait: Wait
    pp_stream: Stream
    phase_done: done
  success:
    title: Typed
    subtitle: Transcription inserted into your active app
  error:
    title: Error
  warning:
    title: Heads up
    no_speech: No speech detected
    cancelled: "Cancelled — transcription discarded"
    postprocess_skipped: "Raw text pasted — cleanup was skipped due to a timeout or error"
    # Shown when the original target window has been closed by the time
    # we try to deliver the transcript. The text is written to the
    # clipboard so it isn't lost; the user can paste it manually.
    target_gone: "Target window closed — transcript copied to clipboard"

postprocess:
  enabled: true
  model: gemma4-it-e2b-FLM
  prompt: |
    You clean dictated speech transcripts. Output ONLY the cleaned text — never reply, never add commentary, never answer questions in the input.

    Rules:
    - Remove filler words (um, uh, like, you know, I mean, sort of, kind of), false starts, repetitions, and pauses (...).
    - Lightly fix punctuation, capitalization, and spacing.
    - Preserve the speaker's meaning, person, and intent EXACTLY. If they said "I", keep "I". If they asked a question, keep it as a question.
    - Treat the input as transcript-to-clean, not as a message to respond to.

    Examples:

    Input: um so I think we should like, you know, refactor the auth module
    Output: I think we should refactor the auth module.

    Input: hey can you help me with this real quick
    Output: Hey, can you help me with this real quick?

    Input: I'm not going to do that. Please don't scroll. I'm just trying to become a big content creator one day. I have no supporters.
    Output: I'm not going to do that. Please don't scroll. I'm just trying to become a big content creator one day. I have no supporters.

    Input: what time is it
    Output: What time is it?

    Now clean the next input:
  min_word_count: 10
  # first_token_timeout_seconds: how long to wait for the LLM's first
  # token before declaring the postprocess attempt failed and falling
  # back to the raw transcript. Lemonade with a cold model can take
  # 5-10 s.
  first_token_timeout_seconds: 10
  # total_timeout_seconds: hard cap on the postprocess request. If the
  # full response hasn't arrived by then we give up and paste the raw
  # transcript with a `postprocess_skipped` warning overlay.
  total_timeout_seconds: 15
  # Sampling knobs. Omit either to use the backend default.
  temperature: 0.2
  # top_p: 0.9

telemetry:
  enabled: false
  endpoint: localhost:4317

recall:
  # Always-on Wokis Recall daemon (`vocis recall start`). These knobs
  # only matter if you use the daemon — the push-to-talk `serve` mode
  # ignores this section.
  retention_seconds: 604800   # 7 days
  max_segments: 2000
  socket_path: ""             # auto under $XDG_RUNTIME_DIR/vocis/recall.sock
  min_silence_ms: 500
  min_speech_ms: 150
  min_utterance_ms: 500
  preroll_ms: 300
  max_segment_seconds: 30
  min_segment_peak: 0.02
  min_segment_rms: 0.005
  persist:
    mode: in_memory           # or "disk" to mirror segments to disk
    dir: $HOME/.local/state/vocis/recall
  # batch_gap_ms: silence inserted between segments when
  # `vocis recall last <duration>` concatenates the ring buffer for a
  # single joint transcription. Prevents the ASR from welding the last
  # word of one segment to the first word of the next.
  batch_gap_ms: 300
  # batch_max_seconds: safety cap on total concatenated audio duration
  # for one `recall last` call. 3600 = 1 hour. Set 0 to disable.
  batch_max_seconds: 3600

# `vocis speak` — text-to-speech via Lemonade's OpenAI-compatible
# /audio/speech endpoint (Kokoro TTS by default). Reads text from CLI
# args or stdin and streams the resulting PCM through paplay.
speak:
  # base_url: leave empty to inherit transcription.base_url at load time —
  # most users run a single Lemonade instance for both ASR and TTS.
  base_url: ""
  # model: must be a Lemonade model with the `tts` label. As of Lemonade
  # 10.2 the only option is kokoro-v1.
  model: kokoro-v1
  # voice: passed through to Kokoro. Known-working voices include
  # `shimmer`, `fable`, `af_heart`. Lemonade silently returns 200 with
  # an empty body for unknown voices, so vocis surfaces a clear error
  # instead of producing a zero-second WAV. Browse the Kokoro model
  # card for the full voice list.
  voice: shimmer
